x-sync-env: &sync-env
  DH_LOG_ALERTHOOK_CHANNELS: ${DH_LOG_ALERTHOOK_CHANNELS:-dingRobot}
  DH_ALERT_CHANNELS_DINGROBOT_PLATFORM: ${DH_ALERT_CHANNELS_DINGROBOT_PLATFORM:-dingtalk}
  DH_ALERT_CHANNELS_DINGROBOT_WEBHOOK: ${DH_ALERT_CHANNELS_DINGROBOT_WEBHOOK:-}
  DH_STORE_MYSQL_HOST: ${DH_STORE_MYSQL_HOST:-host.docker.internal}
  DH_STORE_MYSQL_PORT: ${DH_STORE_MYSQL_PORT:-3306}
  DH_STORE_MYSQL_USERNAME: ${DH_STORE_MYSQL_USERNAME:-root}
  DH_STORE_MYSQL_PASSWORD: ${DH_STORE_MYSQL_PASSWORD:-}
  DH_CFX_CONFIG_BATCH: ${DH_CFX_CONFIG_BATCH:-false}
  DH_EVM_CONFIG_BATCH: ${DH_EVM_CONFIG_BATCH:-false}

x-sync-service: &sync-service
  build:
    context: .
  image: data-house:local
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  net1:
    <<: *sync-service
    container_name: data-house-net1
    command: ["startCfxSync"]
    environment:
      <<: *sync-env
      DH_ALERT_CUSTOMTAGS: ${DH_ALERT_CUSTOMTAGS_NET1:-data-house-net1-svc}
      DH_STORE_MYSQL_DATABASE: ${DH_STORE_MYSQL_DATABASE_NET1:-data_net1}
      DH_CFX_ADAPTERCONFIG_URL: ${DH_CFX_ADAPTERCONFIG_URL_NET1:-http://172.16.29.19:12522}

  net71:
    <<: *sync-service
    container_name: data-house-net71
    command: ["startEvmSync"]
    environment:
      <<: *sync-env
      DH_ALERT_CUSTOMTAGS: ${DH_ALERT_CUSTOMTAGS_NET71:-data-house-net71-svc}
      DH_STORE_MYSQL_DATABASE: ${DH_STORE_MYSQL_DATABASE_NET71:-data_net71}
      DH_EVM_ADAPTERCONFIG_URL: ${DH_EVM_ADAPTERCONFIG_URL_NET71:-http://172.16.29.19:28545}
      DH_EVM_CONFIG_FIRSTBLOCK: ${DH_EVM_CONFIG_FIRSTBLOCK_NET71:-61464999}

  net1029:
    <<: *sync-service
    container_name: data-house-net1029
    command: ["startCfxSync"]
    environment:
      <<: *sync-env
      DH_ALERT_CUSTOMTAGS: ${DH_ALERT_CUSTOMTAGS_NET1029:-data-house-net1029-svc}
      DH_STORE_MYSQL_DATABASE: ${DH_STORE_MYSQL_DATABASE_NET1029:-data_1029}
      DH_CFX_ADAPTERCONFIG_URL: ${DH_CFX_ADAPTERCONFIG_URL_NET1029:-http://172.16.2.240:12569}

  net1030:
    <<: *sync-service
    container_name: data-house-net1030
    command: ["startEvmSync"]
    environment:
      <<: *sync-env
      DH_ALERT_CUSTOMTAGS: ${DH_ALERT_CUSTOMTAGS_NET1030:-data-house-net1030-svc}
      DH_STORE_MYSQL_DATABASE: ${DH_STORE_MYSQL_DATABASE_NET1030:-data_1030}
      DH_EVM_ADAPTERCONFIG_URL: ${DH_EVM_ADAPTERCONFIG_URL_NET1030:-http://172.16.2.240:28545}
      DH_EVM_CONFIG_FIRSTBLOCK: ${DH_EVM_CONFIG_FIRSTBLOCK_NET1030:-36935000}

  monitor:
    <<: *sync-service
    container_name: data-house-monitor
    command: ["startMonitor"]
    ports:
      - "${DH_MONITOR_PORT:-8080}:8080"
    environment:
      <<: *sync-env
      DH_ALERT_CUSTOMTAGS: ${DH_ALERT_CUSTOMTAGS_MONITOR:-data-house-net1029-svc}
